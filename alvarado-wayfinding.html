<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Find Your Unit — The Alvarado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #FFFFFF;
    --bg-panel: #F4F5F7;
    --ink: #12161F;
    --ink-soft: #5B6472;
    --unit-fill: #FFFFFF;
    --unit-stroke: #A7AFBC;
    --corridor: #8D96A3;
    --door: #FFFFFF;
    --ground: #0E7C66;
    --upper: #7C3AED;
    --focus: #1D5FD6;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px 14px 48px;
  }
  main { width: 100%; max-width: 460px; }
  header { margin-bottom: 18px; }
  .eyebrow { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
  h1 {
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: 27px;
    line-height: 1.15;
    margin: 0 0 6px;
  }
  .sub { font-size: 14.5px; color: var(--ink-soft); line-height: 1.5; max-width: 40ch; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    margin: 20px 0 22px;
  }
  .grid button {
    aspect-ratio: 1;
    border-radius: 9px;
    border: 1.5px solid var(--unit-stroke);
    background: var(--unit-fill);
    color: var(--ink);
    font-family: "Work Sans", sans-serif;
    font-weight: 600;
    font-size: 17px;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease, transform 80ms ease;
  }
  .grid button:hover { border-color: var(--ground); }
  .grid button:active { transform: scale(0.94); }
  .grid button:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; }
  .grid button[aria-pressed="true"] { background: var(--ground); border-color: var(--ground); color: #FFFFFF; }
  .grid button[aria-pressed="true"].upper { background: var(--upper); border-color: var(--upper); }
  .grid button .fl { display: block; font-weight: 400; font-size: 8.5px; margin-top: 1px; opacity: 0.75; }

  .map-wrap { margin-bottom: 16px; overflow: hidden; }
  #zoomGroup { transform-origin: 0 0; transition: transform 550ms cubic-bezier(0.4, 0, 0.2, 1); }
  svg { display: block; width: 100%; height: auto; max-height: 76vh; margin: 0 auto; }

  .corridor-line { fill: none; stroke: var(--corridor); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .door-gap { fill: var(--door); }

  .route {
    fill: none;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 2600;
    stroke-dashoffset: 2600;
    opacity: 0;
  }
  .route.ground { stroke: var(--ground); }
  .route.upper { stroke: var(--upper); }
  .route.active { opacity: 1; transition: stroke-dashoffset 700ms ease, opacity 150ms ease; stroke-dashoffset: 0; }
  .route.route-fill {
    stroke: none;
    stroke-dasharray: none;
    stroke-dashoffset: 0;
    transition: none;
  }
  .route.route-fill.ground { fill: var(--ground); }
  .route.route-fill.upper { fill: var(--upper); }
  .route.route-fill.active { transition: opacity 200ms ease; }

  .unit-circle { fill: var(--unit-fill); stroke: var(--unit-stroke); stroke-width: 2.5; transition: fill 200ms ease, stroke 200ms ease; }
  .unit-label {
    font-family: "Work Sans", sans-serif;
    font-weight: 700;
    font-size: 15px;
    fill: var(--ink);
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    transition: fill 200ms ease;
  }
  .unit.ground.active .unit-circle { fill: var(--ground); stroke: var(--ground); }
  .unit.upper.active .unit-circle { fill: var(--upper); stroke: var(--upper); }
  .unit.active .unit-label { fill: #FFFFFF; }
  svg.focused .unit:not(.active) { opacity: 0; transition: opacity 150ms ease; }

  .entrance-star { fill: var(--ink); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--ink-soft); padding: 10px 4px 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .legend i.ground { background: var(--ground); }
  .legend i.upper { background: var(--upper); }

  .directions { background: var(--bg-panel); border: 1px solid var(--unit-stroke); border-radius: 14px; padding: 16px 18px; min-height: 92px; }
  .directions .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .directions .letter { font-family: "Fraunces", serif; font-weight: 700; font-size: 22px; }
  .directions .letter.ground { color: var(--ground); }
  .directions .letter.upper { color: var(--upper); }
  .directions .floor-tag { font-size: 12px; color: var(--ink-soft); }
  .directions p { margin: 0; font-size: 15px; line-height: 1.55; }
  .directions .placeholder { color: var(--ink-soft); font-size: 14.5px; line-height: 1.5; }

  footer { margin-top: 20px; font-size: 11.5px; color: var(--ink-soft); line-height: 1.5; text-align: center; }
</style>
</head>

      <g id="unit-Q" class="unit ground" data-unit="Q"><circle class="unit-circle" cx="321.5" cy="409.8" r="13"></circle><text class="unit-label" x="321.5" y="409.8">Q</text></g>
      <g id="unit-E" class="unit ground" data-unit="E"><circle class="unit-circle" cx="166.1" cy="420.6" r="13"></circle><text class="unit-label" x="166.1" y="420.6">E</text></g>
      <g id="unit-C" class="unit ground" data-unit="C"><circle class="unit-circle" cx="124.7" cy="501.1" r="13"></circle><text class="unit-label" x="124.7" y="501.1">C</text></g>
      <g id="unit-R" class="unit ground" data-unit="R"><circle class="unit-circle" cx="360.9" cy="714.9" r="13"></circle><text class="unit-label" x="360.9" y="714.9">R</text></g>
      <g id="unit-A" class="unit ground" data-unit="A"><circle class="unit-circle" cx="117.9" cy="1004.5" r="13"></circle><text class="unit-label" x="117.9" y="1004.5">A</text></g>
      <g id="unit-S" class="unit ground" data-unit="S"><circle class="unit-circle" cx="367.2" cy="1098.6" r="13"></circle><text class="unit-label" x="367.2" y="1098.6">S</text></g>
      <g id="unit-H" class="unit upper" data-unit="H"><circle class="unit-circle" cx="293.8" cy="123.1" r="13"></circle><text class="unit-label" x="293.8" y="123.1">H</text></g>
      <g id="unit-J" class="unit upper" data-unit="J"><circle class="unit-circle" cx="319.4" cy="122.9" r="13"></circle><text class="unit-label" x="319.4" y="122.9">J</text></g>
      <g id="unit-L" class="unit upper" data-unit="L"><circle class="unit-circle" cx="345.2" cy="122.9" r="13"></circle><text class="unit-label" x="345.2" y="122.9">L</text></g>
      <g id="unit-N" class="unit upper" data-unit="N"><circle class="unit-circle" cx="370.8" cy="123.2" r="13"></circle><text class="unit-label" x="370.8" y="123.2">N</text></g>
      <g id="unit-D" class="unit upper" data-unit="D"><circle class="unit-circle" cx="174.0" cy="455.5" r="13"></circle><text class="unit-label" x="174.0" y="455.5">D</text></g>
      <g id="unit-F" class="unit upper" data-unit="F"><circle class="unit-circle" cx="198.9" cy="455.8" r="13"></circle><text class="unit-label" x="198.9" y="455.8">F</text></g>
      <g id="unit-P" class="unit upper" data-unit="P"><circle class="unit-circle" cx="349.6" cy="522.3" r="13"></circle><text class="unit-label" x="349.6" y="522.3">P</text></g>
      <g id="unit-B" class="unit upper" data-unit="B"><circle class="unit-circle" cx="202.4" cy="918.6" r="13"></circle><text class="unit-label" x="202.4" y="918.6">B</text></g>
      <g id="unit-T" class="unit upper" data-unit="T"><circle class="unit-circle" cx="258.9" cy="1076.3" r="13"></circle><text class="unit-label" x="258.9" y="1076.3">T</text></g>
      </g>
    </svg>

    <div class="legend">
      <span><i class="ground"></i> ground floor</span>
      <span><i class="upper"></i> 2nd floor</span>
    </div>
  </div>

  <div class="directions" id="directions">
    <p class="placeholder">Select a letter above to see directions.</p>
  </div>

  <footer>Schematic corridor map for wayfinding only — not to scale.</footer>
</main>

<script>
  const UNITS = {
    A: { floor: 1, text: "First door on the left as soon as you enter the gate." },
    B: { floor: 2, text: "Just inside the main entrance, take the stairs on the right. Unit B is at the top." },
    C: { floor: 1, text: "Walk half way into the courtyard and Unit C is on the left, the door is to the left of the staircase." },
    D: { floor: 2, text: "Walk halfway into the courtyard and turn left. Take the stairs on the left, Unit D is up and the door is on the right." },
    E: { floor: 1, text: "Walk half way into the courtyard and Unit E is on the left, the door is to the right of the staircase." },
    F: { floor: 2, text: "Walk halfway into the courtyard and turn left. Take the stairs on the left, Unit F is up and the door is on the left." },
    G: { floor: 1, text: "Walk to the end of the courtyard and veer left. Unit G is on the left side back corner." },
    H: { floor: 2, text: "Walk to the end of the courtyard and veer right. At the back right corner there\u2019s a set of stairs. Unit H is up the stairs, straight across the balcony and the door is on the left side of the alcove." },
    I: { floor: 1, text: "Walk to the end of the courtyard and veer left. Unit I is the back corner unit." },
    J: { floor: 2, text: "Walk to the end of the courtyard and veer right. At the back right corner there\u2019s a set of stairs. Unit J is up the stairs, straight across the balcony and the door is on the right side of the alcove." },
    K: { floor: 1, text: "Walk to the end of the courtyard and veer right. The door to unit K is on the left before the stairs." },
    L: { floor: 2, text: "Walk to the end of the courtyard and veer right. At the back right corner there\u2019s a set of stairs. Unit L is up the stairs, first door on the right." },
    M: { floor: 1, text: "Walk to the end of the courtyard and veer right. The door to Unit M is on the right before the stairs." },
    N: { floor: 2, text: "Walk to the end of the courtyard and veer right. At the back right corner there\u2019s a set of stairs. Unit N is up the stairs, first door on the left." },
    O: { floor: 1, text: "Walk halfway into the courtyard and look to the right. You\u2019ll see a rounded section with a big wooden door. Unit O is inside that foyer, left hand door." },
    P: { floor: 2, text: "Walk into the courtyard and notice a small set of stairs on the right going up to what looks like a tower. That\u2019s Unit P." },
    Q: { floor: 1, text: "Walk halfway into the courtyard and look to the right. You\u2019ll see a rounded section with a big wooden door. Unit Q is inside that foyer, door straight ahead." },
    R: { floor: 1, text: "Walk into the courtyard and Unit R is the first door on the right." },
    S: { floor: 1, text: "Unit S has its own entrance at the front of the building. Look for it out front, to the right of the main entrance. It\u2019s the gate on the ground level by the corner of the building." },
    T: { floor: 2, text: "Unit T has its own entrance at the front of the building. There\u2019s a flight of stairs in the front of the building to the right of the main entrance. Unit T is at the top." }
  };

  const gridEl = document.querySelector(".grid");
  const letters = Object.keys(UNITS).sort();
  const buttons = {};

  letters.forEach(letter => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("aria-pressed", "false");
    if (UNITS[letter].floor === 2) btn.classList.add("upper");
    btn.innerHTML = letter + (UNITS[letter].floor === 2 ? '<span class="fl">2nd fl</span>' : '<span class="fl">&nbsp;</span>');
    btn.addEventListener("click", () => select(letter));
    gridEl.appendChild(btn);
    buttons[letter] = btn;
  });

  const directionsEl = document.getElementById("directions");
  const zoomGroup = document.getElementById("zoomGroup");
  const VB = { x: 55, y: 55, w: 470, h: 1120 };
  let current = null;

  function unionBBox(boxes) {
    const x1 = Math.min(...boxes.map(b => b.x));
    const y1 = Math.min(...boxes.map(b => b.y));
    const x2 = Math.max(...boxes.map(b => b.x + b.width));
    const y2 = Math.max(...boxes.map(b => b.y + b.height));
    return { x: x1, y: y1, width: x2 - x1, height: y2 - y1 };
  }

  function zoomToRoute(letter) {
    const routeEl = document.getElementById("route-" + letter);
    const unitCircle = document.querySelector("#unit-" + letter + " .unit-circle");
    const starEl = document.querySelector(".entrance-star");
    const box = unionBBox([routeEl.getBBox(), unitCircle.getBBox(), starEl.getBBox()]);

    const pad = 55;
    const bx = box.x - pad, by = box.y - pad;
    const bw = box.width + pad * 2, bh = box.height + pad * 2;

    let scale = Math.min(VB.w / bw, VB.h / bh);
    scale = Math.max(1, Math.min(scale, 2.6));

    const cx = bx + bw / 2, cy = by + bh / 2;
    const targetCx = VB.x + VB.w / 2, targetCy = VB.y + VB.h / 2;
    const tx = targetCx - scale * cx;
    const ty = targetCy - scale * cy;

    zoomGroup.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  function select(letter) {
    if (current === letter) return;
    if (current) {
      buttons[current].setAttribute("aria-pressed", "false");
      document.getElementById("route-" + current).classList.remove("active");
      document.getElementById("unit-" + current).classList.remove("active");
    }
    current = letter;
    buttons[letter].setAttribute("aria-pressed", "true");
    document.getElementById("route-" + letter).classList.add("active");
    document.getElementById("unit-" + letter).classList.add("active");
    document.getElementById("map").classList.add("focused");
    zoomToRoute(letter);

    const info = UNITS[letter];
    const floorClass = info.floor === 2 ? "upper" : "ground";
    directionsEl.innerHTML =
      '<div class="head"><span class="letter ' + floorClass + '">Unit ' + letter + '</span>' +
      '<span class="floor-tag">' + (info.floor === 2 ? "2nd floor" : "Ground floor") + '</span></div>' +
      '<p>' + info.text + '</p>';
  }
</script>
</body>
</html>
